services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: pg, POSTGRES_DB: seats }
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seats"]
      interval: 2s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:pg@db:5432/seats
      ADMIN_TOKEN: admin-secret
      POOL_MAX: "20"
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
